<svg xmlns="http://www.w3.org/2000/svg" width="840" height="240" viewBox="0 0 840 240" role="img" aria-labelledby="t d">
  <title id="t">Algorithms Education</title>
  <desc id="d">A tile of ascending bars next to the words Algorithms Education</desc>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
  </defs>
  <!-- icon tile -->
  <rect x="20" y="20" width="200" height="200" rx="44" fill="url(#g)"/>
  <!-- ascending bars built from blocks: a sort in progress -->
  <g fill="#FFFFFF" fill-opacity="0.95">
    <rect x="52"  y="156" width="28" height="28" rx="6"/>
    <rect x="92"  y="120" width="28" height="64" rx="6"/>
    <rect x="132" y="84"  width="28" height="100" rx="6"/>
    <rect x="172" y="48"  width="28" height="136" rx="6"/>
  </g>
  <!-- the one element still out of place, highlighted -->
  <circle cx="66" cy="76" r="16" fill="#FBBF24"/>
  <path d="M66 96 L66 140" stroke="#FBBF24" stroke-width="6" stroke-linecap="round" stroke-dasharray="2 12"/>
  <!-- wordmark -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#0F172A">
    <text x="258" y="118" font-size="78" font-weight="700" letter-spacing="-2">Algorithms</text>
    <text x="260" y="186" font-size="54" font-weight="400" fill="#475569">Education</text>
  </g>
</svg>
